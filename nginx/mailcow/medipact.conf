# ===========================================================================
# DIES IST DIE EINZIGE nginx-Conf, die medipact.de tatsaechlich ausliefert.
# ---------------------------------------------------------------------------
# Zielpfad auf dem Server:
#   /opt/mailcow-dockerized/data/conf/nginx/medipact.conf
# (dort per bind-mount als /etc/nginx/conf.d/medipact.conf im Container)
#
# Warum nicht der Host-nginx: Port 80/443 gehoeren dem Container
# `mailcowdockerized-nginx-mailcow-1`. Der Host-nginx-Dienst steht auf
# `failed` und liefert nichts aus — /etc/nginx/sites-enabled/ auf dem Host
# ist wirkungslos, ebenso ../nginx/medipact.conf in diesem Repo.
#
# Ausrollen (deploy.sh fasst nginx NICHT an):
#   sudo cp ~/medipact/nginx/mailcow/medipact.conf \
#           /opt/mailcow-dockerized/data/conf/nginx/medipact.conf
#   sudo docker exec mailcowdockerized-nginx-mailcow-1 nginx -t
#   sudo docker exec mailcowdockerized-nginx-mailcow-1 nginx -s reload
#
# Pruefen: curl -sI https://www.medipact.de/ | head -3   -> muss 301 sein
# ===========================================================================

# HTTP: ACME-Challenge ausliefern, alles andere hart auf den non-www-Host.
# Hier stand bis 17.08.2026 `return 301 https://$host$request_uri;`. $host
# behaelt www bei — der Client landete also auf https://www und blieb dort.
# Zusammen mit dem Doppel-server_name unten gab es in der ganzen Kette
# keinen Punkt, an dem www je verlassen wurde.
server {
    listen 80;
    server_name medipact.de www.medipact.de;
    location /.well-known/acme-challenge/ {
        alias /web/.well-known/acme-challenge/;
    }
    location / {
        return 301 https://medipact.de$request_uri;
    }
}

# HTTPS www -> non-www. Ohne diesen eigenen Serverblock lieferte
# www.medipact.de ein stilles 200 aus, weil beide Hostnamen im selben
# server_name des App-Blocks standen. Fund aus der GSC-Analyse vom
# 12.08.2026: sieben www-URLs im Index, vier davon echte Dubletten mit
# abweichender Position. Canonical und Sitemap standen immer auf non-www —
# es fehlte nur dieser Block.
# Zertifikat: dasselbe wie unten, mailcow verwaltet es ueber den
# acme-Container; www ist als SAN enthalten.
server {
    listen 443 ssl;
    server_name www.medipact.de;
    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    return 301 https://medipact.de$request_uri;
}

# HTTPS: die eigentliche App. 172.22.1.1 ist das Gateway des
# mailcow-Docker-Netzes, also der Host — aus dem Container heraus ist
# 127.0.0.1 dessen eigenes Loopback und erreicht das Next.js NICHT.
server {
    listen 443 ssl;
    server_name medipact.de;
    ssl_certificate /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    # Video-Uploads der Einladungs-Botschaft (Backend-Limit 50 MB + Overhead)
    client_max_body_size 60m;
    location / {
        proxy_pass http://172.22.1.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
