# ###########################################################################
# ACHTUNG — DIESE DATEI IST NICHT AKTIV UND WAR ES NIE.
# ---------------------------------------------------------------------------
# Stand 17.08.2026: Port 80/443 gehoeren dem Container
# `mailcowdockerized-nginx-mailcow-1`; der Host-nginx-Dienst steht auf
# `failed`. Alles hier drin ist wirkungslos — inklusive der unten
# beschriebenen http2- und proxy_cache-Optimierungen, die also NIE gegriffen
# haben.
#
# Die real ausgelieferte Conf liegt in nginx/mailcow/medipact.conf.
# Sie kann diese Datei auch nicht einfach uebernehmen: `proxy_pass
# http://127.0.0.1:3002` zeigt im Container auf dessen eigenes Loopback, und
# die Zertifikatspfade unter /etc/letsencrypt/live/ gelten dort nicht.
#
# Diese Datei bleibt vorerst als Referenz fuer die beiden noch offenen
# Optimierungen (http2, Bild-Cache) liegen — beide muessten in die
# mailcow-Conf portiert werden.
# ###########################################################################

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name medipact.de www.medipact.de;
    return 301 https://medipact.de$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# GEHÖRT NICHT HIERHER, SONDERN IN DEN http{}-BLOCK von /etc/nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
# Cache für den Next.js-Bild-Optimizer. Ohne den transkodiert der VPS jede
# Bildvariante nach jedem Deploy neu (der Next-eigene Cache liegt in
# .next/cache/images und wird beim Build weggeräumt) — AVIF-Encoding eines
# 1600px-Fotos kostet auf einem geteilten Kern rund eine Sekunde, und zwar
# genau an dem Bild, das auf jeder Marketing-Seite das LCP-Element ist.
# Dieser Cache überlebt Deploys, der Aufwand fällt also einmal pro Variante an.
#
#   proxy_cache_path /var/cache/nginx/nextimg levels=1:2 keys_zone=nextimg:10m
#                    max_size=1g inactive=30d use_temp_path=off;
#
# Danach: mkdir -p /var/cache/nginx/nextimg && chown www-data: /var/cache/nginx/nextimg
# ─────────────────────────────────────────────────────────────────────────────

# HTTPS – www → non-www. Ohne diesen Block liefert www.medipact.de über
# HTTPS ein stilles 200 statt einer 301 (der HTTP-Block oben redirectet nur
# von Port 80 auf https://medipact.de — greift nicht mehr, sobald der Client
# schon https:// anfragt, z. B. via HSTS, Backlink oder Lesezeichen).
# Fund aus der GSC-Analyse vom 12.08.2026: sieben www-URLs im Index, vier
# davon echte Dubletten mit abweichender Position zur non-www-Seite, weil ein
# Crawler, der einmal auf www landet, dort bleibt (interne Links zeigen dann
# ebenfalls auf www). Canonical und Sitemap standen schon immer auf non-www —
# es fehlte nur dieser Server-Block.
server {
    listen 443 ssl http2;
    server_name www.medipact.de;

    ssl_certificate     /etc/letsencrypt/live/medipact.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medipact.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://medipact.de$request_uri;
}

# HTTPS
server {
    # http2 ist der Grund, warum das Hero-Bild bisher in der Warteschlange
    # stand: über HTTP/1.1 öffnet der Browser höchstens 6 Verbindungen pro
    # Host, und darum konkurrierten Fonts, JS-Chunks und das LCP-Bild.
    #
    # Diese Schreibweise (http2 im listen) gilt für nginx < 1.25.1 — also für
    # das nginx aus Ubuntu 22.04. Ab 1.25.1 ist sie deprecated, dort stattdessen
    # `listen 443 ssl;` plus eine eigene Zeile `http2 on;`.
    # Prüfen mit: nginx -v
    listen 443 ssl http2;
    server_name medipact.de;

    ssl_certificate     /etc/letsencrypt/live/medipact.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medipact.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Erlaubt Video-Uploads der Einladungs-Botschaft (Backend-Limit: 50 MB,
    # etwas Puffer für multipart-Overhead). Ohne dies greift der nginx-Default
    # von 1 MB und Uploads scheitern mit 413 -> "Video konnte nicht hochgeladen werden".
    client_max_body_size 60m;

    # FastAPI direkt für die Mobile-App (mobile/): /backend/... -> 127.0.0.1:8000/...
    # Der trailing Slash in proxy_pass entfernt das /backend-Präfix. Auth läuft
    # über JWT-Bearer (/auth/login, /auth/refresh) – kein Cookie, kein CORS-Thema
    # (native Apps senden keinen Origin-Header).
    location /backend/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 30m;  # Logbuch-Uploads: Backend-Limit 25 MB + Overhead
    }

    # Bild-Optimizer: gecacht, damit das teure Transkodieren einmal pro Variante
    # anfällt und nicht nach jedem Deploy erneut. Muss VOR `location /` stehen.
    # Setzt den proxy_cache_path aus dem Kommentar oben voraus — ohne den
    # startet nginx mit "proxy_cache" not found nicht.
    location /_next/image {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache            nextimg;
        # Der Key ist die volle Query (url + w + q) — genau das unterscheidet
        # die Varianten voneinander.
        proxy_cache_key        "$scheme$request_method$host$request_uri";
        proxy_cache_valid      200 30d;
        # Läuft ein Eintrag ab, liefert nginx weiter die alte Datei aus und holt
        # die neue im Hintergrund. So wartet nie ein echter Nutzer auf ein
        # AVIF-Encoding.
        proxy_cache_use_stale  updating error timeout;
        proxy_cache_background_update on;
        proxy_cache_lock       on;
        add_header             X-Cache-Status $upstream_cache_status always;
    }

    # Next.js App
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
